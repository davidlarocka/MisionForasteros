name: Deploy a prod DigitalOcenan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Iniciando deploy..."

            cd /var/www/misionforasteros || exit 1

            echo "📥 Pull repo..."
            git pull origin main

            echo "📦 Sync theme al contenedor WordPress..."
            docker cp ./wordpress/wp-content/themes/mision-forasteros \
            wordpress:/var/www/html/wp-content/themes/

            echo "🔄 Reiniciando PHP + Nginx..."
            docker restart wordpress
            docker restart nginx

            echo "🧹 Limpiando caches de WordPress (opcional)"
            docker exec wordpress bash -c "rm -rf /var/www/html/wp-content/cache || true"

            echo "✅ Deploy completado"