server {
    listen 80;
    server_name misionforasteros.cl www.misionforasteros.cl;

    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;
    server_name misionforasteros.cl www.misionforasteros.cl;

    root /var/www/html;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/misionforasteros.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/misionforasteros.cl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64M;

    # 🔥 WordPress routing base (CRÍTICO)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # 🔥 PHP-FPM (mínimo necesario, sin ruido)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # 🔥 Proteger archivos ocultos
    location ~ /\.(?!well-known).* {
        deny all;
    }
}