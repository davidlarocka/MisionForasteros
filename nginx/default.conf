server {
    listen 80;
    server_name misionforasteros.cl www.misionforasteros.cl;

    # Forzar HTTPS
    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;
    server_name misionforasteros.cl www.misionforasteros.cl;

    root /var/www/html;
    index index.php index.html;

    # SSL (Certbot montado desde host)
    ssl_certificate /etc/letsencrypt/live/misionforasteros.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/misionforasteros.cl/privkey.pem;

    # Seguridad básica (opcional pero recomendado)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Tamaño de uploads
    client_max_body_size 64M;

    # 🔥 WordPress routing correcto
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # 🔥 PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # 🔥 CLAVE para WordPress + Gutenberg + HTTPS
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param REQUEST_SCHEME https;
    }

    # 🔥 Evitar acceso a archivos ocultos
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # 🔥 Cache básico para assets (mejora admin también)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        access_log off;
    }
}